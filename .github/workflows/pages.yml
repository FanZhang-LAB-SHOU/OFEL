name: Deploy laboratory website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build static pages
        run: python3 scripts/build-site.py
      - name: Check clean URL routing
        run: python3 scripts/test-site-paths.py
      - name: Check responsive images and mobile card controls
        run: |
          python3 scripts/test-responsive-images.py
          node scripts/test-gateway-cards.cjs
          node scripts/test-profile-layout.cjs
          node scripts/test-team-space.cjs
          node scripts/test-profile-gallery.cjs
      - name: Check page links and assets
        run: python3 scripts/check-site.py
      - name: Check sitemap and sharing metadata
        run: python3 scripts/check-sharing.py
      - name: Check News categories and research links
        run: |
          python3 scripts/check-editorial-links.py
          node scripts/test-news-filters.cjs
      - name: Check publication search and citations
        run: |
          python3 scripts/test-publication-citations.py
          node scripts/test-publication-tools.cjs
      - name: Check More statistics and world clocks
        run: |
          node scripts/test-more.cjs
          node scripts/test-more-ui.cjs
          node demos/world-weather/test-model.cjs
          node demos/world-weather/test-controller.cjs
      - name: Upload website
        if: github.repository == 'FanZhang-LAB-SHOU/OFEL'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    # Forks validate the site without requiring their own Pages configuration.
    if: github.repository == 'FanZhang-LAB-SHOU/OFEL'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
